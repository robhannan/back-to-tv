# Versions for the Android build, pinned exactly.
[versions]
# Android Gradle Plugin. It builds Kotlin itself (AGP 9's built-in Kotlin).
agp = "9.5.1"
# Kotlin Gradle Plugin on the build classpath, overriding the older one AGP brings.
kotlin = "2.4.21"
# WebSockets for LG's network remote protocol.
okhttp = "4.12.0"

[libraries]
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
